name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'fix/**'
      - 'security/**'
      - 'refactor/**'
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar ruff
        run: pip install ruff
      - name: Ruff check (backend)
        run: ruff check backend/app

  test:
    name: Test (pytest + integración)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar .env para CI (sin secretos reales)
        run: |
          cat > .env <<EOF
          POSTGRES_DB=pos_db
          POSTGRES_USER=product
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ci-password}
          POSTGRES_HOST=pos-db
          POSTGRES_PORT=5432
          FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL:-admin@posAdmin.com}
          FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-ci-super-password}
          FIRST_SUPERUSER_FULL_NAME=Admin
          SECRET_KEY=${SECRET_KEY:-$(openssl rand -hex 32)}
          ACCESS_TOKEN_EXPIRE_SECONDS=90000
          ENVIRONMENT=development
          CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173"]
          LOGIN_RATE_LIMIT_PER_MINUTE=1000
          LLM_PROVIDER=ollama
          OLLAMA_BASE_URL=http://localhost:11434
          LLM_MODEL=llama3.1:8b
          EMBEDDING_MODEL=nomic-embed-text:latest
          EOF
      - name: Levantar stack (bd + api)
        run: docker compose up -d --build
      - name: Esperar a que la API esté lista
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8003/docs >/dev/null 2>&1; then
              echo "API lista"; exit 0
            fi
            sleep 2
          done
          echo "La API no respondió a tiempo"; docker compose logs --tail=100 pos-api; exit 1
      - name: Sembrar datos demo
        run: |
          for i in 1 2 3; do
            echo "Intento ${i}/3"
            if docker compose exec -T pos-api python -u -m seed_demo; then
              echo "Seed completado"; exit 0
            fi
            sleep 5
          done
          echo "Seed falló tras 3 intentos."
          docker compose logs --tail=60 pos-api
          exit 1
      - name: Tests unitarios
        run: docker compose exec -T pos-api pytest -q
      - name: Tests de integración (endpoints)
        run: docker compose exec -T pos-api pytest /app/backend/app/test/test_api_endpoints.py -q