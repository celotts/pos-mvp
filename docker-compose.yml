services:
  pos-db:
    image: pgvector/pgvector:pg16
    container_name: pos-db
    env_file:
      - .env
    ports:
      - "5440:5432" # <-- Cambiado a 5440 para evitar el conflicto del puerto 5439
    volumes:
      - pos_db_data:/var/lib/postgresql/data
      - ./V1__create_tables.sql:/docker-entrypoint-initdb.d/V1__create_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pos_network

  pos-api:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    container_name: pos-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    ports:
      - "8003:8000"
    volumes:
      - ./backend/app:/app
    env_file:
      - .env
    environment:
      # Apunta al Ollama nativo que corre en tu Mac fuera de Docker
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    dns:
      - 8.8.8.8
    depends_on:
      pos-db:
        condition: service_healthy
    networks:
      - pos_network

networks:
  pos_network:
    driver: bridge

volumes:
  pos_db_data:
    driver: local