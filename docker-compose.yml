services:
  pos-db:
    image: pgvector/pgvector:pg16
    container_name: pos-db # Estandarizado a guion medio
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5439:5432" # Volvemos a un puerto estable después de liberarlo
    volumes:
      - ./script_data/V1__initial_schema.sql:/docker-entrypoint-initdb.d/init.sql
      - pos_db_data:/var/lib/postgresql/data # Añadir volumen para persistencia de datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: # Corregido para usar la red del proyecto
      - pos_network

  pos-api:
    # Especificamos el contexto de forma explícita para evitar problemas
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pos_api
    # Ejecuta el script de inicialización correcto y luego inicia el servidor
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    ports:
      - "8003:8000" # Cambiado a 8003 para evitar otro conflicto de puerto
    volumes:
      - ./backend/app:/app
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      # Conexión con Ollama en el Host (Linux / Podman / Docker)
      - OLLAMA_BASE_URL=http://host.containers.internal:11434
      - LLM_MODEL=llama3.2:latest
      - EMBEDDING_MODEL=nomic-embed-text:latest
    env_file:
      - .env
    depends_on:
      pos-db:
        condition: service_healthy
    networks: # Corregido para usar la red del proyecto
      - pos_network

networks: # Corregido para usar la red del proyecto
  pos_network:
    driver: bridge

volumes: # Definir el volumen nombrado
  pos_db_data:
    driver: local