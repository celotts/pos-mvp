services:
  pos-db:
    image: pgvector/pgvector:pg16
    container_name: pos_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./script_data/V1__initial_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: # Corregido para usar la red del proyecto
      - pos_network

  pos-api:
    build:
      context: . # El contexto es la raíz del proyecto
      dockerfile: Dockerfile # El Dockerfile está en la raíz del proyecto
    container_name: pos_api
    # Ejecuta el script de inicialización correcto y luego inicia el servidor
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    ports:
      - "8002:8000" # Cambiado a 8002 para evitar conflictos de puerto en la máquina local
    volumes:
      - ./backend/app:/app
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=development

      # Conexión con Ollama en el Host (Linux / Podman / Docker)
      - OLLAMA_BASE_URL=http://host.containers.internal:11434
      - LLM_MODEL=llama3.2:latest
      - EMBEDDING_MODEL=nomic-embed-text:latest
      # Conexión asíncrona con PostgreSQL (asyncpg)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pos-db:5432/${POSTGRES_DB}
      # Credenciales para el primer superusuario (FALTABAN AQUÍ)
      - FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD}
      - FIRST_SUPERUSER_FULL_NAME=${FIRST_SUPERUSER_FULL_NAME}
      # Seguridad y Bootstrap
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_SECONDS=${ACCESS_TOKEN_EXPIRE_SECONDS}
    depends_on:
      pos-db:
        condition: service_healthy
    networks: # Corregido para usar la red del proyecto
      - pos_network



networks: # Corregido para usar la red del proyecto
  pos_network:
    driver: bridge