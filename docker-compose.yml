services:
  pos-db:
    image: pgvector/pgvector:pg16
    container_name: pos-db
    env_file:
      - .env
    ports:
      - "5440:5432"
    volumes:
      - pos_db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pos_network

  pos-api:
    build:
      context: .
      dockerfile: Dockerfile
      pull: true
    container_name: pos-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend/app
    working_dir: /app/backend/app
    ports:
      - "8003:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.containers.internal:11434
      - LLM_MODEL=llama3.2:latest
      - PYTHONPATH=/app/backend/app:/app/backend:/app
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
    depends_on:
      pos-db:
        condition: service_healthy
    networks:
      - pos_network

networks:
  pos_network:
    driver: bridge

volumes:
  pos_db_data:
    driver: local